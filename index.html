<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BTC 5M AI Lab - Beta 0.2</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #151a23;
      --text-main: #ffffff;
      --text-sub: #8a93a6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --blue: #3b82f6;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .status-badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
    }
    .card-title {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }
    .price {
      font-size: 28px;
      font-weight: bold;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .stat-box {
      background: rgba(255,255,255,0.03);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-val {
      font-size: 20px;
      font-weight: bold;
      margin-top: 4px;
    }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .yellow { color: var(--yellow); }
    .blue { color: var(--blue); }
    
    .prediction-badge {
      font-size: 24px;
      font-weight: bold;
      margin: 8px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      background: var(--blue);
      border: none;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h2 style="margin:0;">BTC 5M AI Lab</h2>
      <span style="font-size: 12px; color: var(--text-sub);">Beta 0.2 · Conexión Binance</span>
    </div>
    <div id="conn-status" class="status-badge">Conectando...</div>
  </div>

  <!-- Tarjeta de Precio -->
  <div class="card">
    <div class="card-title">Vela Actual BTC/USDT (5M)</div>
    <div id="btc-price" class="price">$--,---.--</div>
    <div style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">
      Tiempo restante: <span id="timer" class="yellow">--:--</span>
    </div>
  </div>

  <!-- Pronóstico en Vivo -->
  <div class="card">
    <div class="card-title">Pronóstico en Vivo</div>
    <div id="pred-direction" class="prediction-badge blue">ANALIZANDO...</div>
    <div style="font-size: 14px;">
      Confianza estimada: <b id="pred-confidence">--%</b>
    </div>
    <div style="font-size: 12px; color: var(--text-sub); margin-top: 6px;">
      Recomendación: <b id="pred-recommendation" class="yellow">ESPERANDO VELA</b>
    </div>
  </div>

  <!-- Módulo de Estadísticas (Beta 0.2) -->
  <div class="card">
    <div class="card-title">Rendimiento Histórico (Beta 0.2)</div>
    <div class="grid-2">
      <div class="stat-box">
        <div style="font-size:12px; color:var(--text-sub);">Aciertos</div>
        <div id="stat-hits" class="stat-val green">0</div>
      </div>
      <div class="stat-box">
        <div style="font-size:12px; color:var(--text-sub);">Fallos</div>
        <div id="stat-misses" class="stat-val red">0</div>
      </div>
      <div class="stat-box">
        <div style="font-size:12px; color:var(--text-sub);">Abstenciones</div>
        <div id="stat-abstained" class="stat-val yellow">0</div>
      </div>
      <div class="stat-box">
        <div style="font-size:12px; color:var(--text-sub);">Precisión</div>
        <div id="stat-accuracy" class="stat-val blue">0.0%</div>
      </div>
    </div>
    <button style="margin-top: 12px; background: rgba(239, 68, 68, 0.2); color: var(--red);" onclick="resetStats()">
      Reiniciar Estadísticas
    </button>
  </div>

  <script>
    // Configuración y variables del sistema de métricas
    let lastSignal = null;
    let stats = JSON.parse(localStorage.getItem('btc5m_stats')) || { hits: 0, misses: 0, abstained: 0 };

    function updateStatsUI() {
      document.getElementById('stat-hits').innerText = stats.hits;
      document.getElementById('stat-misses').innerText = stats.misses;
      document.getElementById('stat-abstained').innerText = stats.abstained;
      
      const totalEvaluated = stats.hits + stats.misses;
      const accuracy = totalEvaluated > 0 ? ((stats.hits / totalEvaluated) * 100).toFixed(1) : "0.0";
      document.getElementById('stat-accuracy').innerText = accuracy + "%";
      
      localStorage.setItem('btc5m_stats', JSON.stringify(stats));
    }

    function resetStats() {
      if (confirm("¿Deseas reiniciar el contador de aciertos y fallos?")) {
        stats = { hits: 0, misses: 0, abstained: 0 };
        updateStatsUI();
      }
    }

    // Pedir permiso para notificaciones en Android
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function sendNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body: body, icon: "icon-192.png" });
      }
    }

    // WebSocket Binance en tiempo real
    const ws = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@kline_5m");

    ws.onopen = () => {
      document.getElementById('conn-status').innerText = "Binance conectado";
      document.getElementById('conn-status').style.background = "rgba(34, 197, 94, 0.15)";
      document.getElementById('conn-status').style.color = "#22c55e";
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      const kline = data.k;

      const currentPrice = parseFloat(kline.c).toFixed(2);
      const openPrice = parseFloat(kline.o);
      const isCandleClosed = kline.x;

      document.getElementById('btc-price').innerText = "$" + currentPrice;

      // Cálculo simple de tiempo restante de la vela 5M
      const now = new Date().getTime();
      const eventTime = data.E;
      const restSec = Math.max(0, Math.floor((kline.T - now) / 1000));
      const m = Math.floor(restSec / 60).toString().padStart(2, '0');
      const s = (restSec % 60).toString().padStart(2, '0');
      document.getElementById('timer').innerText = `${m}:${s}`;

      // Simulación de modelo predictivo para la vela activa
      const diff = ((currentPrice - openPrice) / openPrice) * 100;
      const confidence = Math.min(95, Math.max(50, 50 + Math.abs(diff) * 100)).toFixed(1);

      let direction = diff >= 0 ? "SUBIR" : "BAJAR";
      let recommendation = confidence > 65 ? "ENTRAR" : "NO ENTRAR";

      const predElem = document.getElementById('pred-direction');
      predElem.innerText = direction;
      predElem.className = "prediction-badge " + (direction === "SUBIR" ? "green" : "red");

      document.getElementById('pred-confidence').innerText = confidence + "%";
      document.getElementById('pred-recommendation').innerText = recommendation;
      document.getElementById('pred-recommendation').className = recommendation === "ENTRAR" ? "green" : "yellow";

      // Alerta si la confianza supera el 70%
      if (confidence > 70 && recommendation === "ENTRAR" && (!lastSignal || lastSignal.time !== kline.t)) {
        sendNotification("¡Señal BTC 5M!", `Dirección: ${direction} | Confianza: ${confidence}%`);
      }

      // Al cerrar la vela de 5 minutos, evaluamos la predicción registrada
      if (isCandleClosed) {
        if (lastSignal) {
          if (lastSignal.recommendation === "NO ENTRAR") {
            stats.abstained++;
          } else {
            const realDirection = parseFloat(kline.c) >= parseFloat(kline.o) ? "SUBIR" : "BAJAR";
            if (lastSignal.direction === realDirection) {
              stats.hits++;
            } else {
              stats.misses++;
            }
          }
          updateStatsUI();
        }

        // Guardamos la señal para la siguiente vela
        lastSignal = {
          time: kline.t,
          direction: direction,
          confidence: confidence,
          recommendation: recommendation
        };
      }
    };

    updateStatsUI();
  </script>

</body>
</html>
